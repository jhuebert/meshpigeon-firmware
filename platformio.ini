; MeshPigeon Radio Firmware — https://github.com/jhuebert/meshpigeon-firmware
;
; The dumbest possible durable radio: receive & retain raw packets, key up
; on demand, persist radio settings. No protocol, no keys, no repeat logic.

[platformio]
default_envs = xiao_wio, heltec_v3, t114, t1000e

[env]
monitor_speed = 115200

[env:common-esp32]
platform = espressif32
framework = arduino
lib_deps =
  jgromes/RadioLib@^7.1.0
  h2zero/NimBLE-Arduino@^1.4.3
build_flags =
  -std=gnu++17
  -Wall
  -DMESHPIGEON_ESP32

[env:common-nrf52]
platform = nordicnrf52
framework = arduino
lib_deps =
  jgromes/RadioLib@^7.1.0
build_flags =
  -std=gnu++17
  -Wall
  -DMESHPIGEON_NRF52
  -D RADIOLIB_TONE_UNSUPPORTED   ; Adafruit nRF52 core has no tone()
lib_ldf_mode = deep+

; ---- XIAO ESP32-S3 + Wio SX1262 (primary dev board) --------------------------
[env:xiao_wio]
extends = env:common-esp32
board = seeed_xiao_esp32s3
build_src_filter = +<main.cpp>
board_build.arduino.memory_type = qio_opi
build_flags =
  ${env:common-esp32.build_flags}
  -D MESHPIGEON_BOARD_XIAO_WIO
  -D MESHPIGEON_STORE_BYTES=262144   ; PSRAM-backed (8 MB OPI)
  -D MESHPIGEON_RADIO_SX1262
  -D MESHPIGEON_RADIO_DIO2_RFSWITCH
  -D MESHPIGEON_RADIO_RX_BOOSTED_GAIN
  -D MESHPIGEON_PIN_LORA_NSS=41
  -D MESHPIGEON_PIN_LORA_SCK=40
  -D MESHPIGEON_PIN_LORA_MOSI=9
  -D MESHPIGEON_PIN_LORA_MISO=8
  -D MESHPIGEON_PIN_LORA_RST=42
  -D MESHPIGEON_PIN_LORA_BUSY=45
  -D MESHPIGEON_PIN_LORA_DIO1=7
  -D MESHPIGEON_PIN_LORA_DIO2=38   ; RF switch
  -D MESHPIGEON_PIN_LORA_DIO3=39   ; TCXO
  -D MESHPIGEON_LORA_TCXO_MV=1800
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D ARDUINO_USB_MSC_ON_BOOT=0

; ---- Heltec V3 (ESP32-S3 + SX1262) -------------------------------------------
[env:heltec_v3]
extends = env:common-esp32
board = heltec_wifi_lora_32_V3
build_src_filter = +<main.cpp>
build_flags =
  ${env:common-esp32.build_flags}
  -D MESHPIGEON_BOARD_HELTEC_V3
  -D MESHPIGEON_STORE_BYTES=65536
  -D MESHPIGEON_RADIO_SX1262
  -D MESHPIGEON_RADIO_DIO2_RFSWITCH
  -D MESHPIGEON_RADIO_RX_BOOSTED_GAIN
  -D MESHPIGEON_PIN_LORA_NSS=8
  -D MESHPIGEON_PIN_LORA_SCK=9
  -D MESHPIGEON_PIN_LORA_MOSI=10
  -D MESHPIGEON_PIN_LORA_MISO=11
  -D MESHPIGEON_PIN_LORA_RST=12
  -D MESHPIGEON_PIN_LORA_BUSY=13
  -D MESHPIGEON_PIN_LORA_DIO1=14
  -D MESHPIGEON_LORA_TCXO_MV=1800
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1

; ---- Seeed T114 (nRF52840 + SX1262) ------------------------------------------
; BLE for nRF52 boards lands with the first bench bring-up (see README);
; v1 T114 builds speak USB CDC only.
[env:t114]
extends = env:common-nrf52
board = seeed_t114
build_src_filter = +<main.cpp>
build_flags =
  ${env:common-nrf52.build_flags}
  -D MESHPIGEON_BOARD_T114
  -D MESHPIGEON_STORE_BYTES=65536
  -D MESHPIGEON_RADIO_SX1262
  -D MESHPIGEON_RADIO_RX_BOOSTED_GAIN
  -D MESHPIGEON_PIN_LORA_NSS=11
  -D MESHPIGEON_PIN_LORA_SCK=12
  -D MESHPIGEON_PIN_LORA_MOSI=13
  -D MESHPIGEON_PIN_LORA_MISO=14
  -D MESHPIGEON_PIN_LORA_RST=16
  -D MESHPIGEON_PIN_LORA_BUSY=15
  -D MESHPIGEON_PIN_LORA_DIO1=17
  -D MESHPIGEON_PIN_VBAT_ADC=31
  -D MESHPIGEON_VBAT_DIVIDER=1.648f
  -D MESHPIGEON_LORA_TCXO_MV=1800
  -D USE_TINYUSB=1

; ---- Seeed Tracker T1000-E (nRF52840 + LR1110) -------------------------------
; Mirrors MeshCore's t1000-e variant: LR1110 with DIO3 TCXO 1.6 V, DIO5-8 RF
; switch table, HP TX up to 22 dBm, boosted RX gain. Battery sense and the
; DC/DC converter follow MeshCore's T1000eBoard. USB CDC only — BLE deferred
; with the other nRF52 boards (see README).
[env:t1000e]
extends = env:common-nrf52
board = tracker-t1000-e
board_build.ldscript = boards/nrf52840_s140_v7.ld
build_src_filter = +<main.cpp>
platform_packages =
  framework-arduinoadafruitnrf52 @ https://github.com/meshcore-dev/Adafruit_nRF52_Arduino#d541301665b40959682252911e57b11df3ee651a
  platformio/toolchain-gccarmnoneeabi@^1.140201.0
build_flags =
  ${env:common-nrf52.build_flags}
  -D MESHPIGEON_BOARD_T1000E
  -D MESHPIGEON_STORE_BYTES=65536
  -D MESHPIGEON_RADIO_LR1110
  -D MESHPIGEON_RADIO_RF_SWITCH_TABLE
  -D MESHPIGEON_RADIO_RX_BOOSTED_GAIN
  -D MESHPIGEON_PIN_LORA_NSS=12
  -D MESHPIGEON_PIN_LORA_SCK=11
  -D MESHPIGEON_PIN_LORA_MOSI=41
  -D MESHPIGEON_PIN_LORA_MISO=40
  -D MESHPIGEON_PIN_LORA_RST=42
  -D MESHPIGEON_PIN_LORA_BUSY=7
  -D MESHPIGEON_PIN_LORA_DIO1=33
  -D MESHPIGEON_PIN_VBAT_ADC=2
  -D MESHPIGEON_ADC_MULTIPLIER=2.0f
  -D MESHPIGEON_PIN_3V3_EN=38
  -D MESHPIGEON_LORA_TCXO_MV=1600

; ---- Host unit tests (run in CI with zero hardware) ---------------------------
[env:native]
platform = native
build_src_filter = -<*>      ; board mains don't compile on the host
test_framework = unity
build_flags =
  -std=gnu++17
  -Wall
  -Wextra
  -DMESHPIGEON_NATIVE

; ---- Desktop radio simulator (TCP server speaking the same protocol) ----------
; A stand-in for a real radio on the bench: implements the identical command
; processor behind a TCP bridge, with scriptable RF loss/dup behavior.
; Build:  pio run -e sim    -> .pio/build/sim/meshpigeon-sim
; Run:    .pio/build/sim/meshpigeon-sim --port 8765
[env:sim]
platform = native
build_src_filter = +<sim_main.cpp>
build_flags =
  -std=gnu++17
  -Wall
  -DMESHPIGEON_NATIVE
